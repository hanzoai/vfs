name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: hanzo-build-linux-amd64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
          cache: true
      - name: vet
        run: go vet ./...
      - name: test (default)
        run: go test -race ./...
      - name: vet (fuse)
        run: go vet -tags fuse ./...
      - name: install fuse
        run: sudo apt-get update && sudo apt-get install -y fuse
      - name: build (fuse)
        run: go build -tags fuse ./...
      - name: test (fuse + sqlite e2e)
        run: VFS_FUSE_E2E=1 go test -race -tags fuse -run TestFUSESQLite ./pkg/mount/ -v

  build-amd64:
    needs: test
    runs-on: hanzo-build-linux-amd64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
          cache: true
      - name: build
        run: |
          VERSION=$(tr -d ' \n\r\t' < VERSION)
          mkdir -p dist
          CGO_ENABLED=0 go build \
            -ldflags "-X main.version=${VERSION}" \
            -o dist/vfs-linux-amd64 ./cmd/vfs
      - uses: actions/upload-artifact@v4
        with:
          name: vfs-linux-amd64
          path: dist/vfs-linux-amd64

  image:
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: hanzo-build-linux-amd64
    steps:
      - uses: actions/checkout@v4
      - name: login ghcr
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: build + push
        run: |
          VERSION=$(tr -d ' \n\r\t' < VERSION)
          IMG=ghcr.io/hanzoai/vfs
          docker build --build-arg VERSION=${VERSION} -t ${IMG}:${VERSION} .
          docker tag ${IMG}:${VERSION} ${IMG}:latest
          docker push ${IMG}:${VERSION}
          docker push ${IMG}:latest
