# Go virtual filesystem with SQLite replication. Library + cmd/.
# Gate: the module compiles and the unit suite runs under the race detector —
# this package is concurrent by construction, so -race is the assertion that
# matters. The image is built by the release lane, not on every push.
test:
  - name: test
    run: |
      set -euo pipefail
      go build ./...
      go test -race ./...
