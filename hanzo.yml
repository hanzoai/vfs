# Go virtual filesystem with SQLite replication. Library + cmd/.
#
# The gates below run as jobs, three at a time, one per entry: .github/workflows/cicd.yml
# has a matrix that names each by `gates:`, and its last entry takes everything the
# others do not, so an entry added here is gated by default. Each is under five
# minutes, and what makes that possible is what each job has to compile: the SQLite
# engine is a large build and only the gate that needs it (`sqlite`) builds it, the
# race detector doubles a build and runs where there are goroutines, and the server
# the real-server tests need is taken from its published image, not built.
#
#   check            build, vet and gofmt of everything but the SQLite packages
#   unit             the engine's unit tests (-short)
#   race             the tests with goroutines, under the race detector (-short)
#   model            the tests that run random operations against a plain model, in
#                    -short size: no goroutines, so no race detector, which would
#                    multiply the hashing and sealing they do tenfold
#   sparse           the randomised tests of holes at full size (not -short)
#   sparse-tiny      the same with tiny bounds, 40 seeds
#   sqlite           the packages that run a real SQLite engine on a Volume
#   realserver       the engine, its store client and the fence against a real Hanzo S3 server
#   realserver-cas   the conditional-write race on small objects, against the real server
#   realserver-cas-large  the same on a 20 MiB object and on racing creators
#   realserver-kill  a writer killed at random moments, against the real server
#   scale-a/b/c      the measurements: 100,000 files, a million inodes, sync cost, the
#                    object budget, a petabyte, amplification (-short skips them)
#   fuzz             the model run over many more seeds
#   fuzz-head        the Head parser against a decoder written from the text, coverage-guided
#   internal         the hash (internal/blake3) and the buffer pool (internal/bufpool), under
#                    the race detector: their tests check the digests against the official
#                    vectors and a second library, and the pool's sharing rules
#
# The realserver gates fail if a test they exist for did not pass: a skip is a
# failure there, never a pass. The real server is the published image of release
# v1.0.41, pinned by digest (tools/ci/s3server.sh); tests find it as `s3` on PATH, and
# there is no environment switch.
#
# The tests on a kernel mount are not gates here. They assert what Linux's FUSE does
# (a close is not interrupted by the kernel, truncate and chmod answer as Linux's do,
# an unmount ends the server), and need /dev/fuse and a fusermount3 that mounts for an
# unprivileged user, or a user namespace with tools/fusemount in its place
# (tools/ci/mount.sh). Where the kernel answers FUSE differently they would test that
# kernel. They run on a Linux host before a release, on amd64 and on arm64:
# `go test -tags fuse -count=1 ./pkg/mount ./internal/sqlitecheck`. What the mount does
# that needs no kernel (the commits, the interrupts, the context every read runs on) is
# tested by calling its handlers, in the `race` gate.
test:
  - name: realserver
    run: |
      set -euo pipefail
      bin=$(mktemp -d)
      tools/ci/s3server.sh "$bin"
      export PATH="$bin:$PATH"
      log="$bin/realserver.log"
      go test -count=1 -v -timeout 4m \
        -run '^(TestRealServerConforms|TestRealServerRaceStress|TestRealServerMultipartIsConditional|TestPrefixConfinement|TestCommitRateOnRealServer|TestGetPairsBodyWithVersion|TestCancelledS3RequestsAreNotFaults|TestConditionalWriteAtTheSingleRequestBound|TestSameRoundRace|TestFenceRefusesOlderRound|TestAttachNeedsAHigherRound|TestTakeoverLosesNoAcknowledgedCommit|TestRacingClaims|TestVolumeOnEveryStore|TestExtensionObjectsOnEveryStore|TestExtensionObjectsRaced|TestStrayKeysAreIgnoredAndKept|TestExtNamesAndCollisions|TestExtMasquerade|TestExtReadIsBounded|TestListTimesAndPages|TestStrayKeys)$' \
        . ./pkg/backend/s3 | tee "$log"
      for t in TestRealServerConforms TestRealServerRaceStress TestRealServerMultipartIsConditional \
               TestPrefixConfinement TestCommitRateOnRealServer TestGetPairsBodyWithVersion \
               TestCancelledS3RequestsAreNotFaults TestConditionalWriteAtTheSingleRequestBound \
               TestSameRoundRace/hanzo-s3 TestFenceRefusesOlderRound/hanzo-s3 TestAttachNeedsAHigherRound/hanzo-s3 \
               TestTakeoverLosesNoAcknowledgedCommit/hanzo-s3 TestRacingClaims/hanzo-s3 TestVolumeOnEveryStore/hanzo-s3 \
               TestExtensionObjectsOnEveryStore/hanzo-s3 TestExtensionObjectsRaced/hanzo-s3 TestStrayKeysAreIgnoredAndKept/hanzo-s3 \
               TestExtNamesAndCollisions/hanzo-s3 TestExtMasquerade/hanzo-s3 TestExtReadIsBounded/hanzo-s3 \
               TestListTimesAndPages/hanzo-s3 TestStrayKeys/hanzo-s3; do
        grep -q -- "--- PASS: $t " "$log" || { echo "did not pass against the real server: $t"; exit 1; }
      done
  - name: realserver-cas
    run: |
      set -euo pipefail
      bin=$(mktemp -d)
      tools/ci/s3server.sh "$bin"
      export PATH="$bin:$PATH"
      log="$bin/cas.log"
      go test -count=1 -v -timeout 4m -run '^TestRealServerCAS$/^(identical-1|identical-1048576)$' . | tee "$log"
      for t in TestRealServerCAS/identical-1 TestRealServerCAS/identical-1048576; do
        grep -q -- "--- PASS: $t " "$log" || { echo "did not pass against the real server: $t"; exit 1; }
      done
  - name: realserver-cas-large
    run: |
      set -euo pipefail
      bin=$(mktemp -d)
      tools/ci/s3server.sh "$bin"
      export PATH="$bin:$PATH"
      log="$bin/cas.log"
      go test -count=1 -v -timeout 4m -run '^TestRealServerCAS$/^(identical-20971520|creators|mixed)$' . | tee "$log"
      for t in TestRealServerCAS/identical-20971520 TestRealServerCAS/creators TestRealServerCAS/mixed; do
        grep -q -- "--- PASS: $t " "$log" || { echo "did not pass against the real server: $t"; exit 1; }
      done
  - name: realserver-kill
    run: |
      set -euo pipefail
      bin=$(mktemp -d)
      tools/ci/s3server.sh "$bin"
      export PATH="$bin:$PATH"
      log="$bin/kill.log"
      go test -count=1 -v -timeout 4m -run '^TestKillOverRealServer$' . | tee "$log"
      grep -q -- '--- PASS: TestKillOverRealServer ' "$log" || { echo "TestKillOverRealServer did not pass"; exit 1; }
  - name: check
    run: |
      set -euo pipefail
      pkgs=$(go list ./... | grep -v -e /replica -e /internal/sqlitecheck)
      go build $pkgs
      go vet $pkgs
      go vet -tags fuse ./pkg/mount ./internal/mounttest
      GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build . ./cmd/... ./pkg/... ./tools/...
      GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go vet -tags fuse ./pkg/mount
      test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
  - name: unit
    run: go test -short -count=1 -skip '^Test(Sparse|Model|TreeForced)' . ./cmd/... ./pkg/... ./internal/storetest
  - name: race
    run: |
      set -euo pipefail
      go test -race -short -count=1 ./pkg/...
      go test -race -short -count=1 -run '^Test(ConcurrentWorkers|NoGoroutineLeak|SameRoundRace|RacingClaims|TakeoverLosesNoAcknowledgedCommit|FenceRefusesOlderRound|AttachNeedsAHigherRound|AttachLostAckIsNotStale|StalledCommitStallsNobody|DeposedWriterIsToldAtItsNextCommit|LostAckNoLostUpdateNoDuplicate|LostAckThenTakeoverIsNotReportedLost|VolumeOnEveryStore|FsyncAsksTheStoreForNothing|ProcessCrashReplays|ReplayTwice|TakeoverOnAnotherNodeSaysWhatItCannotKnow|TakeoverDuringPublication|BoundIsKeptFromEachAcknowledgement|GenerationOrdering|BackpressureAndRecovery|MemoryBoundWaitsThenRefuses|ReadsSeeAGenerationInFlight|JournalIsToldAfterTheHead|JournalFillPublishesEarly|SteadyState.*)$' .
      go test -race -tags fuse -short -count=1 -run '^Test(InterruptIsEINTR|FsyncWaitsForTheJournalAndNothingElse|CloseAsksForNothing|ReadWaitsForItsData|FsyncCallersDoNotTouchTheStore|SessionRefusesANilContext|LookedUpFileReadsOnTheMountContext|CreateOfAnExistingFileOpensIt|LookupIsNotAnsweredEINTR|AttrIsNotAnsweredEINTR|ReaddirIsNotAnsweredEINTR|MkdirIsNotAnsweredEINTR|RemoveIsNotAnsweredEINTR|CreateIsNotAnsweredEINTR|NodesAreBuiltOnlyByTheirConstructors|EveryHandlerOutlivesItsRequest|FinishCommitsWhatTheMountWrote|FinishDoesNotWaitForAStalledCommitForever|FinishDoesNotClaimALostCommitIsLost|FinishReportsTheLostCommitEvenWhenServeFailed|FinishWaitsForASlowCommit|FinishReportsWhatWentWrong|FinishOfAReadOnlyVolumeCommitsNothing|KilledColdLookupIsFreedAfterTheGrace|ErrnoMapping)$' ./pkg/mount
  - name: model
    run: go test -short -count=1 -run '^Test(Sparse|Model|TreeForced)' .
  - name: sparse
    run: go test -count=1 -timeout 4m -run '^TestSparse(Exact|Random|CanonicalRuns)$' .
  - name: sparse-tiny
    run: go test -count=1 -timeout 4m -run '^TestSparseTinyBounds$' .
  - name: sqlite
    run: |
      set -euo pipefail
      go vet ./replica ./internal/sqlitecheck
      go vet -tags fuse ./internal/sqlitecheck
      go test -short -count=1 ./replica ./internal/sqlitecheck
  - name: scale-a
    run: go test -count=1 -timeout 4m -run '^(TestHundredThousandFiles|TestMillionInodes|TestSyncCostDoesNotGrowWithTheTree|TestObjectBudget150GiB|TestMillionEntryDirectory|TestSequentialWriteMemory|TestSparsePetabyte)$' .
  - name: scale-b
    run: go test -count=1 -timeout 4m -run '^(TestCheckoutCost|TestCommitPerClose|TestChunkedFilesCommitCost)$' .
  - name: scale-c
    run: go test -count=1 -timeout 4m -run '^(TestObjectsPerThousandSmallFiles|TestAppendWithFsyncAmplification|TestColdReadAmplification|TestSmallWritesAmplifyMemory|TestFlushLatency|TestSustainedWriteWithFsync|TestTinyExtentsCost|TestPetabyteScattered)$' .
  - name: fuzz
    run: go test -count=1 -timeout 4m -run '^TestModelFuzzMany$' .
  - name: fuzz-head
    run: go test -count=1 -timeout 3m -run '^$' -fuzz '^FuzzHead$' -fuzztime 20s .
  - name: internal
    run: go test -race -count=1 -timeout 4m ./internal/blake3 ./internal/bufpool
